name: Validator regression tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check validator.js
          node --check worktable.js
      - name: Run validator regression tests
        run: node tests/validator.test.js
      - name: Run worktable movement tests
        run: node tests/worktable.test.js
      - name: Check page integration and inline JavaScript
        run: node tests/page-integration.test.js
